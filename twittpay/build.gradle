plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.twittpay.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Twittpay'
                artifactId = 'twittpay-android-sdk'
                version = '2.3.1'
            }
        }
    }
}
